---
layout: default
---

<article class="post">
  <!--
  {% if page.canonical_url %}
    <div class="canonical-notice">
      <blockquote>
        <p><strong>Nota:</strong> Este artículo fue publicado originalmente <a href="{{ page.canonical_url }}" target="_blank" rel="noopener noreferrer"><strong>aqui</strong></a>.</p>
      </blockquote>
    </div>
  {% endif %}
  -->
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta"><small>Publicado el: {{ page.date | date: "%d de %B de %Y" }}</small></p>
  </header>
  
  {% if page.image %}
    <div class="post-featured-image" style="text-align: center; margin-bottom: 2em;">
      <img src="{{ page.image }}" alt="{{ page.title }}" style="max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
      {% if page.image_caption %}
        <p style="margin-top: 10px;"><small>{{ page.image_caption }}</small></p>
      {% endif %}
    </div>
  {% endif %}
  
  <div class="post-content">
    {{ content }}
  </div>

</article>
